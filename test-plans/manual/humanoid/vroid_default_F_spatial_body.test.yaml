id: vroid_default_F_spatial_body
spec_section: 'VRMC_vrm_animation (producer interop: Spatial iOS VRMA export — body bones + hips root motion; producer quirk: hips translation channel present but hips unregistered in humanBones, so conformant consumers drop the root motion — signal is head/rightUpperArm rotations + agreement on dropping unmapped translation)'
asset: vroid_default_F_1_0.vrm
animation:
  vrma:
    path: spatial_body_motion.vrma
    apply_at_time: 1.0
camera:
  position:
  - 0.0
  - 1.0
  - 2.6
  target:
  - 0.0
  - 0.9
  - 0.0
  up:
  - 0.0
  - 1.0
  - 0.0
  fov_degrees: 30.0
lighting:
  directional:
    dir:
    - -0.3
    - -0.6
    - -0.7
    color:
    - 1.0
    - 1.0
    - 1.0
    intensity: 1.0
  ambient:
    color:
    - 0.5
    - 0.5
    - 0.5
    intensity: 0.3
  cast_shadows: false
  receive_shadows: false
post_processing:
  tone_mapping: none
  exposure: 1.0
output:
  width: 1024
  height: 1024
  color_space: srgb
  msaa: 4
diff:
  mode: ssim
  threshold: 0.90
  reference_renderer: three-vrm
  pose_tolerance:
    per_bone_quaternion_radians: 0.010
    hips_translation_m: 0.005
    per_preset_expression: 0.005
    per_custom_expression: 0.005
    look_at_yaw_pitch_degrees: 1.0
    offset_from_head_bone_m: 0.001
  conformance_status:
    kind: included
ignore_renderers: []
properties: []
