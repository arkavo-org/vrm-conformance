<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>three-vrm renderer host</title>
    <style>
      html, body { margin: 0; padding: 0; background: #ff00ff; overflow: hidden; }
      #c { display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/",
          "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.5.0/lib/three-vrm.module.min.js",
          "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@3.5.2/lib/three-vrm-animation.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { VRMLoaderPlugin } from "@pixiv/three-vrm";
      import {
        VRMAnimationLoaderPlugin,
        createVRMAnimationClip,
      } from "@pixiv/three-vrm-animation";

      const MAGENTA = 0xff00ff;

      const state = {
        canvas: null,
        renderer: null,
        scene: null,
        camera: null,
        directional: null,
        ambient: null,
        vrm: null,
        vrmAnimation: null,   // VRMAnimation parsed from .vrma
        vrmaMixer: null,      // THREE.AnimationMixer
        vrmaClip: null,       // THREE.AnimationClip (retargeted)
      };

      function ensureRenderer(width, height) {
        if (!state.canvas) {
          state.canvas = document.getElementById("c");
        }
        state.canvas.width = width;
        state.canvas.height = height;
        if (!state.renderer) {
          state.renderer = new THREE.WebGLRenderer({
            canvas: state.canvas,
            antialias: true,
            alpha: false,
            preserveDrawingBuffer: true,
          });
          state.renderer.setClearColor(MAGENTA, 1.0);
          state.renderer.outputColorSpace = THREE.SRGBColorSpace;
          state.renderer.toneMapping = THREE.NoToneMapping;
        }
        state.renderer.setSize(width, height, false);

        if (!state.scene) {
          state.scene = new THREE.Scene();
          state.scene.background = new THREE.Color(MAGENTA);
        }
        if (!state.camera) {
          state.camera = new THREE.PerspectiveCamera(30, width / height, 0.01, 100);
        } else {
          state.camera.aspect = width / height;
          state.camera.updateProjectionMatrix();
        }
        if (!state.directional) {
          state.directional = new THREE.DirectionalLight(0xffffff, 1.0);
          state.scene.add(state.directional);
        }
        if (!state.ambient) {
          state.ambient = new THREE.AmbientLight(0x808080, 0.3);
          state.scene.add(state.ambient);
        }
      }

      // Three.js layers used by VRMFirstPerson.setup() to reassign meshes
      // tagged firstPersonOnly / thirdPersonOnly. Layer 0 is the default
      // (every object spawns on it; cameras render it). After setup(),
      // firstPersonOnly meshes move to layer FIRST_PERSON_ONLY_LAYER and
      // thirdPersonOnly meshes move to layer THIRD_PERSON_ONLY_LAYER. We
      // enable the thirdPersonOnly layer on the camera so a third-person
      // render shows thirdPersonOnly + both + auto-non-head while the
      // firstPersonOnly variant gets correctly culled. Matches the VMK
      // adapter's behaviour (which the conformance suite renders against
      // as the only previously-conformant firstPerson reference).
      const FIRST_PERSON_ONLY_LAYER = 9;
      const THIRD_PERSON_ONLY_LAYER = 10;

      window.__loadVrm = async function (url) {
        ensureRenderer(1024, 1024);
        if (state.vrm) {
          state.scene.remove(state.vrm.scene);
          state.vrm = null;
        }
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        const gltf = await loader.loadAsync(url);
        const vrm = gltf.userData.vrm;
        state.vrm = vrm;
        state.scene.add(vrm.scene);

        // Activate VRMC_vrm.firstPerson culling. Without this call the
        // plugin parses meshAnnotations into vrm.firstPerson but doesn't
        // touch any object layers, so every annotation type renders
        // identically. setup() assigns layers per the spec's enum.
        if (vrm.firstPerson) {
          vrm.firstPerson.setup({
            firstPersonOnlyLayer: FIRST_PERSON_ONLY_LAYER,
            thirdPersonOnlyLayer: THIRD_PERSON_ONLY_LAYER,
          });
        }

        // Configure the camera for third-person rendering: enable the
        // thirdPersonOnly layer (so thirdPersonOnly meshes ARE rendered)
        // and leave the firstPersonOnly layer disabled (so they are
        // culled). Layer 0 stays enabled by default for `both` and the
        // auto-split non-head portion. This is the camera-mode default
        // the conformance suite expects today; a first-person camera
        // mode would invert the layer enable / disable pair.
        if (state.camera) {
          state.camera.layers.enable(THIRD_PERSON_ONLY_LAYER);
          state.camera.layers.disable(FIRST_PERSON_ONLY_LAYER);
        }
      };

      window.__loadVrma = async function (url) {
        if (!state.vrm) {
          throw new Error("loadVrma: no VRM loaded — call loadVrm first");
        }
        // Clean up any previously loaded VRMA.
        if (state.vrmaMixer) {
          state.vrmaMixer.stopAllAction();
          state.vrmaMixer = null;
        }
        state.vrmAnimation = null;
        state.vrmaClip = null;

        const loader = new GLTFLoader();
        loader.register((parser) => new VRMAnimationLoaderPlugin(parser));
        const gltf = await loader.loadAsync(url);
        const animations = gltf.userData.vrmAnimations;
        if (!animations || animations.length === 0) {
          throw new Error("loadVrma: no VRMAnimation found in glTF userData");
        }
        // VRMA spec: animations[0] is the portable clip.
        state.vrmAnimation = animations[0];

        state.vrmaClip = createVRMAnimationClip(state.vrmAnimation, state.vrm);
        state.vrmaMixer = new THREE.AnimationMixer(state.vrm.scene);
        const action = state.vrmaMixer.clipAction(state.vrmaClip);
        // LoopOnce + clampWhenFinished so setTime(duration) holds the final
        // pose instead of wrapping back to t=0.
        action.setLoop(THREE.LoopOnce, 0);
        action.clampWhenFinished = true;
        action.play();

        const anim = state.vrmAnimation;
        return {
          vrma_handle: 1,
          channel_summary: {
            humanoid_bones: anim.humanoidTracks.rotation.size,
            expressions: anim.expressionTracks.preset.size + anim.expressionTracks.custom.size,
            has_look_at: anim.lookAtTrack != null,
            duration_seconds: state.vrmaClip.duration,
          },
        };
      };

      window.__applyVrmaAtTime = function (params) {
        if (!state.vrm) throw new Error("applyVrmaAtTime: no VRM loaded");
        if (!state.vrmaMixer || !state.vrmaClip) {
          throw new Error("applyVrmaAtTime: no VRMA loaded — call loadVrma first");
        }
        const time = params.time_seconds ?? 0.0;

        // Seek deterministically. setTime sets the mixer's playhead but
        // does not advance simulation state on its own — call update(0) so
        // the bound bones, expression weights, and lookAt evaluator pick
        // up the new sampled state.
        state.vrmaMixer.setTime(time);
        state.vrmaMixer.update(0);

        // Drive the VRM's per-frame update so spring-bone + lookAt
        // evaluators re-derive their state from the newly-set bones.
        if (typeof state.vrm.update === "function") {
          state.vrm.update(0);
        }

        return {
          channels_applied: {
            humanoid_bones: state.vrmAnimation.humanoidTracks?.rotation?.size ?? 0,
            expressions:
              (state.vrmAnimation.expressionTracks?.preset?.size ?? 0) +
              (state.vrmAnimation.expressionTracks?.custom?.size ?? 0),
            look_at: state.vrmAnimation.lookAtTrack != null,
          },
        };
      };

      window.__setCamera = function (params) {
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        state.camera.position.set(...params.position);
        state.camera.up.set(...params.up);
        state.camera.lookAt(new THREE.Vector3(...params.target));
        state.camera.fov = params.fov_degrees;
        state.camera.updateProjectionMatrix();
      };

      window.__setLighting = function (params) {
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const d = params.directional;
        // three.js DirectionalLight is positioned at (x,y,z); aim is from
        // position toward (0,0,0). Set position to negation of incoming-light
        // direction so travel through the scene matches the requested dir.
        state.directional.position.set(-d.dir[0], -d.dir[1], -d.dir[2]).multiplyScalar(5);
        state.directional.color.setRGB(d.color[0], d.color[1], d.color[2]);
        // three.js since r155 uses physically-correct directional-light
        // intensity (lux); three-vrm's spec-intended MToon baseline assumes
        // intensity=Math.PI (≈ legacy three.js / Unity URP "intensity 1.0").
        // Test plans declare 1.0; the adapter scales by π to match the
        // cross-renderer convention. See docs/methodology.md "directional
        // intensity convention" and pixiv/three-vrm#1838.
        state.directional.intensity = d.intensity * Math.PI;
        state.directional.castShadow = !!params.cast_shadows;
        if (state.renderer) {
          state.renderer.shadowMap.enabled = !!params.cast_shadows;
        }
        const a = params.ambient;
        state.ambient.color.setRGB(a.color[0], a.color[1], a.color[2]);
        state.ambient.intensity = a.intensity;
      };

      window.__setPostProcessing = function (params) {
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const map = {
          None: THREE.NoToneMapping,
          Linear: THREE.LinearToneMapping,
          Reinhard: THREE.ReinhardToneMapping,
          Aces: THREE.ACESFilmicToneMapping,
        };
        state.renderer.toneMapping = map[params.tone_mapping] ?? THREE.NoToneMapping;
        state.renderer.toneMappingExposure = params.exposure ?? 1.0;
      };

      const HUMANOID_BONES = [
        "hips", "spine", "chest", "neck", "head",
        "leftShoulder", "leftUpperArm", "leftLowerArm", "leftHand",
        "rightShoulder", "rightUpperArm", "rightLowerArm", "rightHand",
        "leftUpperLeg", "leftLowerLeg", "leftFoot",
        "rightUpperLeg", "rightLowerLeg", "rightFoot",
      ];

      const PRESET_EXPRESSIONS = [
        "happy", "angry", "sad", "relaxed", "surprised",
        "aa", "ih", "ou", "ee", "oh",
        "blink", "blinkLeft", "blinkRight", "neutral",
      ];

      window.__dumpHumanoidPose = function () {
        if (!state.vrm) throw new Error("dumpHumanoidPose: no VRM loaded");
        const bones = [];
        const missing = [];
        let hipsTranslation = [0, 0, 0];
        for (const name of HUMANOID_BONES) {
          const node = state.vrm.humanoid.getNormalizedBoneNode(name);
          if (node == null) {
            missing.push(name);
            continue;
          }
          const q = node.quaternion;
          bones.push({ name, local_rotation_quat: [q.x, q.y, q.z, q.w] });
          if (name === "hips") {
            const p = node.position;
            hipsTranslation = [p.x, p.y, p.z];
          }
        }
        return {
          bones,
          hips_translation: hipsTranslation,
          bones_missing: missing,
        };
      };

      window.__dumpExpressionWeights = function () {
        if (!state.vrm) throw new Error("dumpExpressionWeights: no VRM loaded");
        const presets = {};
        const custom = {};
        const em = state.vrm.expressionManager;
        if (!em) return { presets, custom };

        for (const name of PRESET_EXPRESSIONS) {
          presets[name] = em.getValue(name) ?? 0.0;
        }

        const presetSet = new Set(PRESET_EXPRESSIONS);
        const exprList = em.expressions ?? [];
        for (const expr of exprList) {
          const exprName = expr.expressionName ?? expr.name;
          if (!exprName || presetSet.has(exprName)) continue;
          custom[exprName] = em.getValue(exprName) ?? 0.0;
        }

        return { presets, custom };
      };

      window.__dumpLookAtState = function () {
        if (!state.vrm) throw new Error("dumpLookAtState: no VRM loaded");
        const lookAt = state.vrm.lookAt;
        const yaw = lookAt?.yaw ?? 0.0;
        const pitch = lookAt?.pitch ?? 0.0;

        // Derive gaze quat. THREE.Euler with 'YXZ' order matches the VRM spec
        // convention (yaw around Y, pitch around X, no roll).
        const euler = new THREE.Euler(
          THREE.MathUtils.degToRad(pitch),
          THREE.MathUtils.degToRad(yaw),
          0,
          "YXZ",
        );
        const q = new THREE.Quaternion().setFromEuler(euler);

        // VRMLookAtBoneApplier and VRMLookAtExpressionApplier both expose a
        // static `type` property ("bone" / "expression") on their constructor.
        let appliedVia = "off";
        if (lookAt?.applier) {
          const staticType = lookAt.applier.constructor?.type;
          if (staticType === "bone") appliedVia = "bone";
          else if (staticType === "expression") appliedVia = "expression";
          else {
            // fallback: discriminate via constructor name
            const ctorName = lookAt.applier.constructor?.name ?? "";
            if (ctorName.includes("Bone")) appliedVia = "bone";
            else if (ctorName.includes("Expression")) appliedVia = "expression";
          }
        }

        const offset = lookAt?.offsetFromHeadBone;
        const offsetArr = offset ? [offset.x, offset.y, offset.z] : [0, 0, 0];

        return {
          gaze_direction_quat: [q.x, q.y, q.z, q.w],
          yaw_deg: yaw,
          pitch_deg: pitch,
          applied_via: appliedVia,
          offset_from_head_bone: offsetArr,
        };
      };

      window.__render = async function (params) {
        ensureRenderer(params.width, params.height);
        // color_space=Srgb is the v1.0 default and the only mode three-vrm
        // produces spec-conformant MToon output in (per pixiv/three-vrm#1838).
        // color_space=Linear is honored but documented as diagnostic-only.
        if (params.color_space === "Linear") {
          state.renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
        } else {
          state.renderer.outputColorSpace = THREE.SRGBColorSpace;
        }
        if (state.vrm && typeof state.vrm.update === "function") {
          state.vrm.update(1 / 60);
        }
        state.renderer.render(state.scene, state.camera);
        const dataUrl = state.canvas.toDataURL("image/png");
        return dataUrl;
      };

      window.__stepPhysics = async function (params) {
        if (!state.vrm) return;
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const dt = (typeof params.dt_seconds === "number" ? params.dt_seconds : 1 / 60);
        const count = (typeof params.count === "number" ? params.count : 1);
        for (let i = 0; i < count; i++) {
          state.vrm.update(dt);
        }
      };

      // Re-loads the most recently-loaded VRM (the BrowserSession serves it
      // via the page.route interceptor at https://app.local/asset), giving
      // a fresh chain at rest pose. Then runs `settle_steps` updates so the
      // chain reaches a stable hanging position before rendering.
      window.__resetPhysics = async function (params) {
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const settle = (typeof params.settle_steps === "number" ? params.settle_steps : 0);

        if (state.vrm) {
          state.scene.remove(state.vrm.scene);
          state.vrm = null;
          const loader = new GLTFLoader();
          loader.register((parser) => new VRMLoaderPlugin(parser));
          const gltf = await loader.loadAsync("https://app.local/asset");
          const vrm = gltf.userData.vrm;
          state.vrm = vrm;
          state.scene.add(vrm.scene);
        }

        if (state.vrm && settle > 0) {
          for (let i = 0; i < settle; i++) {
            state.vrm.update(1 / 60);
          }
        }
      };

      // Drive a linear root-transform animation so spring-bone chains see
      // inertia, not just gravity settling. We translate vrm.scene.position
      // from translation_start to translation_end in steps of 1/fps seconds,
      // calling vrm.update(dt) each step so the chain trails behind.
      window.__animateRootTransform = async function (params) {
        if (!state.vrm) return;
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const start = params.translation_start ?? [0, 0, 0];
        const end = params.translation_end ?? [0, 0, 0];
        const fps = typeof params.fps === "number" && params.fps > 0 ? params.fps : 60;
        const duration = typeof params.duration_seconds === "number" ? params.duration_seconds : 0;
        const steps = Math.max(1, Math.round(duration * fps));
        const dt = 1 / fps;
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          state.vrm.scene.position.set(
            start[0] + (end[0] - start[0]) * t,
            start[1] + (end[1] - start[1]) * t,
            start[2] + (end[2] - start[2]) * t,
          );
          state.vrm.update(dt);
        }
      };

      // Walk all spring-bone joints and reconstruct per-chain grouping.
      //
      // three-vrm v3's VRMSpringBoneManager exposes a flat Set<VRMSpringBoneJoint>
      // via `.joints`. Each VRMSpringBoneJoint has a public readonly `.bone`
      // (head Object3D) and `.child` (tail Object3D). The VRM loader builds
      // N-1 joints for an N-node chain, connecting them via bone→child linkage:
      //   Joint 0: bone=node0, child=node1
      //   Joint 1: bone=node1, child=node2
      //   Joint 2: bone=node2, child=node3 (tip — no joint object for node3)
      //
      // Chain reconstruction:
      //   1. Collect child-bone set (bones that appear as `.child` of some joint).
      //   2. Roots = joints whose `.bone` is NOT in that child-bone set.
      //   3. Walk each chain: follow the joint whose `.bone === current.child`.
      //   4. For the last joint in a chain, also record `.child` world position
      //      so all N nodes appear in joint_positions[].
      //
      // This matches the op contract: springs[] has one entry per
      // VRMC_springBone.springs[i], and joint_positions[] is the head-to-tail
      // world positions for that chain.
      window.__dumpBonePositions = function (params) {
        if (!state.vrm || !state.vrm.springBoneManager) {
          return { springs: [] };
        }
        const mgr = state.vrm.springBoneManager;
        const joints = mgr.joints; // Set<VRMSpringBoneJoint>
        if (!joints || joints.size === 0) {
          return { springs: [] };
        }

        // Build bone → joint lookup
        const boneToJoint = new Map();
        joints.forEach(function (j) { boneToJoint.set(j.bone, j); });

        // Build set of bones that serve as a child (not a root bone)
        const childBones = new Set();
        joints.forEach(function (j) { if (j.child) childBones.add(j.child); });

        // Roots: joints whose bone is not used as a child by any other joint
        const roots = [];
        joints.forEach(function (j) {
          if (!childBones.has(j.bone)) roots.push(j);
        });

        // Walk each chain from its root, collecting world positions
        const wantIdx = (typeof params.spring_index === "number") ? params.spring_index : null;
        const out = [];
        for (let i = 0; i < roots.length; i++) {
          if (wantIdx !== null && i !== wantIdx) continue;
          const root = roots[i];
          const positions = [];
          const v = new THREE.Vector3();
          let cur = root;
          while (cur) {
            cur.bone.getWorldPosition(v);
            positions.push([v.x, v.y, v.z]);
            const nextJoint = cur.child ? boneToJoint.get(cur.child) : null;
            if (!nextJoint) {
              // cur is the last joint in the chain — also record its child (tip)
              if (cur.child) {
                cur.child.getWorldPosition(v);
                positions.push([v.x, v.y, v.z]);
              }
              break;
            }
            cur = nextJoint;
          }
          out.push({
            name: root.bone.name || ("spring_" + i),
            joint_positions: positions,
          });
        }
        return { springs: out };
      };

      // Render a sequence of frames with optional root-transform animation.
      // Returns an array of PNG data URLs (one per frame).
      // params:
      //   frame_count: number — how many frames to capture
      //   physics_dt_seconds: number — physics step size (≤ 1/60)
      //   animate_root_transform: { translation_start, translation_end } | null
      window.__renderSequence = async function (params) {
        if (!state.vrm) {
          throw new Error("__renderSequence: no VRM loaded");
        }
        const width = typeof params.width === "number" ? params.width : 512;
        const height = typeof params.height === "number" ? params.height : 512;
        const colorSpace = typeof params.color_space === "string" ? params.color_space : "Srgb";
        ensureRenderer(width, height);

        const frameCount = typeof params.frame_count === "number" ? params.frame_count : 1;
        const dt = typeof params.physics_dt_seconds === "number" ? params.physics_dt_seconds : 1 / 60;
        const art = params.animate_root_transform;

        // Snapshot original root position for restoration after the sequence.
        const origX = state.vrm.scene.position.x;
        const origY = state.vrm.scene.position.y;
        const origZ = state.vrm.scene.position.z;

        const results = [];
        for (let i = 0; i < frameCount; i++) {
          const t = frameCount > 1 ? i / (frameCount - 1) : 0;

          // Interpolate root translation if animate_root_transform is provided.
          if (art) {
            const start = art.translation_start ?? [0, 0, 0];
            const end = art.translation_end ?? [0, 0, 0];
            state.vrm.scene.position.set(
              start[0] + (end[0] - start[0]) * t,
              start[1] + (end[1] - start[1]) * t,
              start[2] + (end[2] - start[2]) * t,
            );
          }

          // Drive spring-bone physics one step.
          state.vrm.update(dt);

          // Render and collect data URL.
          const dataUrl = await window.__render({
            width: width,
            height: height,
            color_space: colorSpace,
          });
          results.push(dataUrl);
        }

        // Restore original root position.
        state.vrm.scene.position.set(origX, origY, origZ);

        return results;
      };

      window.__dispose = function () {
        if (state.vrm) {
          state.scene.remove(state.vrm.scene);
          state.vrm = null;
        }
      };

      window.__rendererReady = true;
    </script>
  </body>
</html>
