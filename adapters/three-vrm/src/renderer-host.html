<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>three-vrm renderer host</title>
    <style>
      html, body { margin: 0; padding: 0; background: #ff00ff; overflow: hidden; }
      #c { display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/",
          "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.5.0/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { VRMLoaderPlugin } from "@pixiv/three-vrm";

      const MAGENTA = 0xff00ff;

      const state = {
        canvas: null,
        renderer: null,
        scene: null,
        camera: null,
        directional: null,
        ambient: null,
        vrm: null,
      };

      function ensureRenderer(width, height) {
        if (!state.canvas) {
          state.canvas = document.getElementById("c");
        }
        state.canvas.width = width;
        state.canvas.height = height;
        if (!state.renderer) {
          state.renderer = new THREE.WebGLRenderer({
            canvas: state.canvas,
            antialias: true,
            alpha: false,
            preserveDrawingBuffer: true,
          });
          state.renderer.setClearColor(MAGENTA, 1.0);
          state.renderer.outputColorSpace = THREE.SRGBColorSpace;
          state.renderer.toneMapping = THREE.NoToneMapping;
        }
        state.renderer.setSize(width, height, false);

        if (!state.scene) {
          state.scene = new THREE.Scene();
          state.scene.background = new THREE.Color(MAGENTA);
        }
        if (!state.camera) {
          state.camera = new THREE.PerspectiveCamera(30, width / height, 0.01, 100);
        } else {
          state.camera.aspect = width / height;
          state.camera.updateProjectionMatrix();
        }
        if (!state.directional) {
          state.directional = new THREE.DirectionalLight(0xffffff, 1.0);
          state.scene.add(state.directional);
        }
        if (!state.ambient) {
          state.ambient = new THREE.AmbientLight(0x808080, 0.3);
          state.scene.add(state.ambient);
        }
      }

      window.__loadVrm = async function (url) {
        ensureRenderer(1024, 1024);
        if (state.vrm) {
          state.scene.remove(state.vrm.scene);
          state.vrm = null;
        }
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        const gltf = await loader.loadAsync(url);
        const vrm = gltf.userData.vrm;
        state.vrm = vrm;
        state.scene.add(vrm.scene);
      };

      window.__setCamera = function (params) {
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        state.camera.position.set(...params.position);
        state.camera.up.set(...params.up);
        state.camera.lookAt(new THREE.Vector3(...params.target));
        state.camera.fov = params.fov_degrees;
        state.camera.updateProjectionMatrix();
      };

      window.__setLighting = function (params) {
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const d = params.directional;
        // three.js DirectionalLight is positioned at (x,y,z); aim is from
        // position toward (0,0,0). Set position to negation of incoming-light
        // direction so travel through the scene matches the requested dir.
        state.directional.position.set(-d.dir[0], -d.dir[1], -d.dir[2]).multiplyScalar(5);
        state.directional.color.setRGB(d.color[0], d.color[1], d.color[2]);
        // three.js since r155 uses physically-correct directional-light
        // intensity (lux); three-vrm's spec-intended MToon baseline assumes
        // intensity=Math.PI (≈ legacy three.js / Unity URP "intensity 1.0").
        // Test plans declare 1.0; the adapter scales by π to match the
        // cross-renderer convention. See docs/methodology.md "directional
        // intensity convention" and pixiv/three-vrm#1838.
        state.directional.intensity = d.intensity * Math.PI;
        state.directional.castShadow = !!params.cast_shadows;
        if (state.renderer) {
          state.renderer.shadowMap.enabled = !!params.cast_shadows;
        }
        const a = params.ambient;
        state.ambient.color.setRGB(a.color[0], a.color[1], a.color[2]);
        state.ambient.intensity = a.intensity;
      };

      window.__setPostProcessing = function (params) {
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const map = {
          None: THREE.NoToneMapping,
          Linear: THREE.LinearToneMapping,
          Reinhard: THREE.ReinhardToneMapping,
          Aces: THREE.ACESFilmicToneMapping,
        };
        state.renderer.toneMapping = map[params.tone_mapping] ?? THREE.NoToneMapping;
        state.renderer.toneMappingExposure = params.exposure ?? 1.0;
      };

      window.__render = async function (params) {
        ensureRenderer(params.width, params.height);
        // color_space=Srgb is the v1.0 default and the only mode three-vrm
        // produces spec-conformant MToon output in (per pixiv/three-vrm#1838).
        // color_space=Linear is honored but documented as diagnostic-only.
        if (params.color_space === "Linear") {
          state.renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
        } else {
          state.renderer.outputColorSpace = THREE.SRGBColorSpace;
        }
        if (state.vrm && typeof state.vrm.update === "function") {
          state.vrm.update(1 / 60);
        }
        state.renderer.render(state.scene, state.camera);
        const dataUrl = state.canvas.toDataURL("image/png");
        return dataUrl;
      };

      window.__stepPhysics = async function (params) {
        if (!state.vrm) return;
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const dt = (typeof params.dt_seconds === "number" ? params.dt_seconds : 1 / 60);
        const count = (typeof params.count === "number" ? params.count : 1);
        for (let i = 0; i < count; i++) {
          state.vrm.update(dt);
        }
      };

      // Re-loads the most recently-loaded VRM (the BrowserSession serves it
      // via the page.route interceptor at https://app.local/asset), giving
      // a fresh chain at rest pose. Then runs `settle_steps` updates so the
      // chain reaches a stable hanging position before rendering.
      window.__resetPhysics = async function (params) {
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const settle = (typeof params.settle_steps === "number" ? params.settle_steps : 0);

        if (state.vrm) {
          state.scene.remove(state.vrm.scene);
          state.vrm = null;
          const loader = new GLTFLoader();
          loader.register((parser) => new VRMLoaderPlugin(parser));
          const gltf = await loader.loadAsync("https://app.local/asset");
          const vrm = gltf.userData.vrm;
          state.vrm = vrm;
          state.scene.add(vrm.scene);
        }

        if (state.vrm && settle > 0) {
          for (let i = 0; i < settle; i++) {
            state.vrm.update(1 / 60);
          }
        }
      };

      // Drive a linear root-transform animation so spring-bone chains see
      // inertia, not just gravity settling. We translate vrm.scene.position
      // from translation_start to translation_end in steps of 1/fps seconds,
      // calling vrm.update(dt) each step so the chain trails behind.
      window.__animateRootTransform = async function (params) {
        if (!state.vrm) return;
        ensureRenderer(state.canvas?.width ?? 1024, state.canvas?.height ?? 1024);
        const start = params.translation_start ?? [0, 0, 0];
        const end = params.translation_end ?? [0, 0, 0];
        const fps = typeof params.fps === "number" && params.fps > 0 ? params.fps : 60;
        const duration = typeof params.duration_seconds === "number" ? params.duration_seconds : 0;
        const steps = Math.max(1, Math.round(duration * fps));
        const dt = 1 / fps;
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          state.vrm.scene.position.set(
            start[0] + (end[0] - start[0]) * t,
            start[1] + (end[1] - start[1]) * t,
            start[2] + (end[2] - start[2]) * t,
          );
          state.vrm.update(dt);
        }
      };

      // Walk all spring-bone joints and reconstruct per-chain grouping.
      //
      // three-vrm v3's VRMSpringBoneManager exposes a flat Set<VRMSpringBoneJoint>
      // via `.joints`. Each VRMSpringBoneJoint has a public readonly `.bone`
      // (head Object3D) and `.child` (tail Object3D). The VRM loader builds
      // N-1 joints for an N-node chain, connecting them via bone→child linkage:
      //   Joint 0: bone=node0, child=node1
      //   Joint 1: bone=node1, child=node2
      //   Joint 2: bone=node2, child=node3 (tip — no joint object for node3)
      //
      // Chain reconstruction:
      //   1. Collect child-bone set (bones that appear as `.child` of some joint).
      //   2. Roots = joints whose `.bone` is NOT in that child-bone set.
      //   3. Walk each chain: follow the joint whose `.bone === current.child`.
      //   4. For the last joint in a chain, also record `.child` world position
      //      so all N nodes appear in joint_positions[].
      //
      // This matches the op contract: springs[] has one entry per
      // VRMC_springBone.springs[i], and joint_positions[] is the head-to-tail
      // world positions for that chain.
      window.__dumpBonePositions = function (params) {
        if (!state.vrm || !state.vrm.springBoneManager) {
          return { springs: [] };
        }
        const mgr = state.vrm.springBoneManager;
        const joints = mgr.joints; // Set<VRMSpringBoneJoint>
        if (!joints || joints.size === 0) {
          return { springs: [] };
        }

        // Build bone → joint lookup
        const boneToJoint = new Map();
        joints.forEach(function (j) { boneToJoint.set(j.bone, j); });

        // Build set of bones that serve as a child (not a root bone)
        const childBones = new Set();
        joints.forEach(function (j) { if (j.child) childBones.add(j.child); });

        // Roots: joints whose bone is not used as a child by any other joint
        const roots = [];
        joints.forEach(function (j) {
          if (!childBones.has(j.bone)) roots.push(j);
        });

        // Walk each chain from its root, collecting world positions
        const wantIdx = (typeof params.spring_index === "number") ? params.spring_index : null;
        const out = [];
        for (let i = 0; i < roots.length; i++) {
          if (wantIdx !== null && i !== wantIdx) continue;
          const root = roots[i];
          const positions = [];
          const v = new THREE.Vector3();
          let cur = root;
          while (cur) {
            cur.bone.getWorldPosition(v);
            positions.push([v.x, v.y, v.z]);
            const nextJoint = cur.child ? boneToJoint.get(cur.child) : null;
            if (!nextJoint) {
              // cur is the last joint in the chain — also record its child (tip)
              if (cur.child) {
                cur.child.getWorldPosition(v);
                positions.push([v.x, v.y, v.z]);
              }
              break;
            }
            cur = nextJoint;
          }
          out.push({
            name: root.bone.name || ("spring_" + i),
            joint_positions: positions,
          });
        }
        return { springs: out };
      };

      window.__dispose = function () {
        if (state.vrm) {
          state.scene.remove(state.vrm.scene);
          state.vrm = null;
        }
      };

      window.__rendererReady = true;
    </script>
  </body>
</html>
