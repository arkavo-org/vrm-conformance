name: rust

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install validator shim
        run: ./scripts/install-validator.sh
      - name: Run validator-gated integration tests
        env:
          # Cargo runs each test from its crate dir, so the default
          # ".tools/vrm-validator-cli" relative lookup misses. Pin an
          # absolute path so corpus_validation actually exercises the
          # validator instead of skipping.
          VRM_VALIDATOR_BIN: ${{ github.workspace }}/.tools/vrm-validator-cli
        run: cargo test --workspace -- --ignored
