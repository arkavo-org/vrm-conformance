name: godot-vrm

# L1+L2 scaffold: Rust shim + GDScript dispatch. Tasks build the Rust
# crate, install Godot 4 headless, run the GDScript unit tests, and run
# the #[ignore]'d Rust integration test that spawns the shim + real Godot.
#
# Runs on macos-latest because the L3 real-rendering path requires a
# non-headless Godot display driver. The Rust shim spawns Godot with
# `--display-driver macos --rendering-driver metal --audio-driver Dummy`
# per Spike 1 in docs/superpowers/plans/2026-05-11-adapter-godot-vrm-L3.md.
# Linux CI support requires a follow-up spike (likely xvfb-run +
# --display-driver x11 --rendering-driver vulkan).
#
# No untrusted-input usage: this workflow does not read PR titles, commit
# messages, issue bodies, or any other user-controlled fields into run:
# commands.

on:
  pull_request:
    paths:
      - 'adapters/godot-vrm/**'
      - 'crates/vrm-godot-shim/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/godot-vrm.yml'
  push:
    branches: [main]
    paths:
      - 'adapters/godot-vrm/**'
      - 'crates/vrm-godot-shim/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/godot-vrm.yml'

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Godot via Homebrew
        run: |
          brew install --cask godot
          # Homebrew installs the .app bundle; expose the binary on PATH.
          GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
          if [ ! -x "$GODOT_BIN" ]; then
            echo "godot binary not found at $GODOT_BIN" >&2
            ls -la /Applications/Godot.app/Contents/MacOS/ >&2
            exit 1
          fi
          # Symlink for the runner's PATH.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$GODOT_BIN" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$GODOT_BIN" --version

      - name: Build shim
        run: cargo build -p vrm-godot-shim --release

      - name: Run GDScript dispatch unit tests
        run: godot --headless --path adapters/godot-vrm --script tests/run_gdscript_tests.gd

      - name: Run Rust integration contract test
        run: cargo test -p vrm-godot-shim --release --test contract -- --ignored
