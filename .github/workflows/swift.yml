name: swift

on:
  pull_request:
    paths:
      - 'adapters/vrm-metal-kit/**'
      - '.github/workflows/swift.yml'
  push:
    branches: [main]

jobs:
  build:
    # macos-latest is currently macOS 26 (Apple Silicon) on GitHub-hosted
    # runners, which is what VRMMetalKit's `.macOS(.v26)` floor + Swift 6.2
    # toolchain require. Pinning the explicit `macos-26-arm64` label
    # backed up in the runner queue (40+ minutes during L3 development);
    # `macos-latest` picks up faster and auto-rolls when GitHub bumps.
    # If GitHub demotes macos-latest below macOS 26, swift build will
    # fail fast with the package-floor error and we can re-pin.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: adapters/vrm-metal-kit
    steps:
      - uses: actions/checkout@v4
      - name: Swift + Xcode versions
        run: |
          swift --version
          xcodebuild -version
      - run: swift build --configuration debug
      - run: swift test
      - name: Smoke-run adapter binary
        run: |
          # Confirms VRMMetalKit linked and the Metal device probe fires
          # without throwing. Empty stdin → graceful EOF exit.
          echo -n | .build/debug/vrm-metal-kit-adapter
