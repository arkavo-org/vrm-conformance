name: swift

on:
  pull_request:
    paths:
      - 'adapters/vrm-metal-kit/**'
      - '.github/workflows/swift.yml'
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: adapters/vrm-metal-kit
    steps:
      - uses: actions/checkout@v4
      - run: swift build --configuration debug
      - run: swift test
