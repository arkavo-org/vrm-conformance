name: swift

on:
  pull_request:
    paths:
      - 'adapters/vrm-metal-kit/**'
      - '.github/workflows/swift.yml'
  push:
    branches: [main]

jobs:
  build:
    # macos-latest currently maps to macos-15 (Sequoia) on Apple Silicon —
    # its default toolchain is Swift 6.1 / Xcode 16.4, but VRMMetalKit
    # pins .macOS(.v26) + Swift 6.2 and needs Xcode 26 to build. The
    # GitHub-hosted runner ships Xcode 26.3 preinstalled at
    # /Applications/Xcode_26.3.app; we just have to select it before
    # `swift build`. macos-latest is preferable to the explicit
    # `macos-26-arm64` label because the latter backed up in the runner
    # queue for 40+ minutes during L3 development.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: adapters/vrm-metal-kit
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Swift + Xcode versions
        run: |
          swift --version
          xcodebuild -version
      - run: swift build --configuration debug
      # `swift test` + the adapter-binary smoke deliberately skipped on
      # macos-latest. Binaries built with the Xcode 26 toolchain link
      # against macOS 26 system libraries (e.g.
      # /usr/lib/swift/libswift_DarwinFoundation2.dylib) that don't exist
      # on the macos-15 runner — they compile fine but can't load at
      # runtime ("Library not loaded ... DarwinFoundation2"). The build
      # step catches API breakage in VRMMetalKit upstream; test +
      # runtime coverage runs locally (M-series Mac with Xcode 26) and
      # via Xcode Cloud. Re-enable here once GitHub-hosted macos-26
      # runners are reliably picked up without long queues.
