name: site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'goldens/manifest.json'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'goldens/manifest.json'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Stage manifest under site dist
        run: |
          mkdir -p site/dist/goldens
          cp goldens/manifest.json site/dist/goldens/manifest.json || echo '{"version": 1, "entries": []}' > site/dist/goldens/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
